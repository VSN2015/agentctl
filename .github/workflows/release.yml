name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1 -race
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then
            echo "tag '$TAG' is not a valid version (want vMAJOR.MINOR.PATCH[-prerelease])" >&2
            exit 1
          fi
          scripts/build.sh "${TAG#v}"
      - name: Create release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${TAG#v}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "$TAG" "${flags[@]}"
