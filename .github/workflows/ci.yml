name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./... -count=1 -race

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: scripts/build.sh 0.0.0-ci
      - name: Check build output
        run: |
          set -euo pipefail
          test -f dist/SHA256SUMS
          n=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          [ "$n" -eq 4 ] || { echo "expected 4 archives, found $n" >&2; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
          out=$(dist/agentctl_0.0.0-ci_linux_amd64/agentctl --version)
          [ "$out" = "agentctl 0.0.0-ci" ] || { echo "unexpected version output: $out" >&2; exit 1; }
